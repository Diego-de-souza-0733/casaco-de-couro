
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - D-Raw Clothing</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body class="pagina-autenticacao">

    <div class="caixa-autenticacao">

        <a href="index.html" class="logo-autenticacao">
            D-Raw Clothing
        </a>

        <h1>Criar Conta</h1>

        <p class="descricao-autenticacao">
            Faça seu cadastro para acessar nossa loja.
        </p>

        <form id="form-cadastro">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                maxlength="100"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                placeholder="Digite seu telefone"
                maxlength="20"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                minlength="6"
                required
            >

            <button type="submit" id="btn-cadastro">
                Criar minha conta
            </button>

        </form>

        <p id="mensagem" class="mensagem"></p>

        <p class="texto-alternativo">
            Já possui uma conta?
            <a href="login.html">Faça login</a>
        </p>

        <a href="index.html" class="voltar-loja">
            Voltar para a loja
        </a>

    </div>

    <script>
        const formCadastro = document.getElementById('form-cadastro');
        const mensagem = document.getElementById('mensagem');
        const btnCadastro = document.getElementById('btn-cadastro');

        formCadastro.addEventListener('submit', async function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const senha = document.getElementById('senha').value;

            mensagem.textContent = 'Realizando cadastro...';
            mensagem.className = 'mensagem';
            btnCadastro.disabled = true;

            try {
                const resposta = await fetch('http://localhost:3000/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome,
                        telefone,
                        senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro || 'Erro ao realizar cadastro.');
                }

                mensagem.textContent = dados.mensagem || 'Cadastro realizado com sucesso!';
                mensagem.className = 'mensagem sucesso';

                formCadastro.reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (erro) {
                mensagem.textContent = erro.message;
                mensagem.className = 'mensagem erro';

            } finally {
                btnCadastro.disabled = false;
            }
        });
    </script>

</body>
</html>
